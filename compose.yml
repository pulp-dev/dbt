services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./.runtime/clickhouse24/data:/var/lib/clickhouse
      - ./.runtime/clickhouse24/logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 3s
      timeout: 3s
      retries: 20
